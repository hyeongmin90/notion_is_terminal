[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal4gptweb"
version = "0.1.0"
description = "Bridge GPT Web to a persistent Linux terminal and Playwright browser through Notion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Terminal4GPTWeb contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pyte>=0.8.2,<1",
  "playwright>=1.55,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Terminals",
  "Topic :: Utilities",
]

[project.scripts]
terminal4gptweb = "notion_is_terminal.cli:main"
t4g = "notion_is_terminal.cli:main"
notion-terminal = "notion_is_terminal.cli:main"
nit = "notion_is_terminal.cli:main"

[project.urls]
Repository = "https://github.com/hyeongmin90/terminal4gptweb"

[tool.setuptools.packages.find]
include = ["notion_is_terminal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
